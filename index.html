<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hidrata — Controle de água da equipe</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">

    <header class="top">
      <div class="brand">
        <h1>💧 Hidrata</h1>
        <div class="date" id="today-label"></div>
      </div>
      <div class="theme-toggle" role="group" aria-label="Tema">
        <button id="btn-light" title="Tema claro">☀️</button>
        <button id="btn-dark" title="Tema escuro">🌙</button>
      </div>
    </header>

    <section class="who-panel" id="who-panel">
      <h2>Quem é você?</h2>
      <div class="pills" id="pills"></div>
    </section>

    <section class="me-card" id="me-card" style="display:none;">
      <div class="me-info">
        <p class="greeting">Olá, <strong id="me-name"></strong> · <button class="switch-user" id="switch-user">trocar</button></p>
        <p class="total" id="me-total">0<span>ml hoje</span></p>
        <div class="meta-row">
          <span>Meta diária:</span>
          <input type="number" id="meta-input" step="100" min="100" />
          <span>ml</span>
          <button id="save-meta">salvar</button>
        </div>
        <div class="add-buttons">
          <button class="add-btn" data-ml="500">+ 500 ml</button>
        </div>
      </div>
      <div class="tank-big">
        <div class="tank" id="me-tank">
          <div class="tank-fill" id="me-tank-fill"></div>
          <div class="tank-label" id="me-tank-label">0%</div>
        </div>
      </div>
    </section>

    <section>
      <h2 class="section-title">Equipe hoje</h2>
      <div class="team-grid" id="team-grid"></div>
    </section>

    <section class="chart-card">
      <h2 class="section-title">Evolução do dia</h2>
      <canvas id="chart" height="90"></canvas>
      <p class="legend-note">Consumo acumulado (ml) ao longo do dia, por pessoa.</p>
    </section>

  </div>

  <div class="toast" id="toast"></div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
